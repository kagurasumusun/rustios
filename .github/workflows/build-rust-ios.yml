name: build-rust-ios

# Builds a Rust toolchain whose *host* is aarch64-apple-ios, i.e. a rustc that
# runs on an iPhone (the same idea as emexlab/LLVM-On-iOS, which cross-builds
# clang/Swift for iOS). The macOS runner is only the build environment; every
# shipped binary is verified to be iOS/arm64. Packaging follows LLVM-On-iOS:
#
#   RustToolchain-iphoneos-arm64-<ver>.tar.xz      <- SwiftToolchain.zip
#   RustSupportLibs-iphoneos-arm64-<ver>.tar.xz    <- CoreCompilerSupportLibs
#   Rust.xcframework-iphoneos-arm64-<ver>.tar.xz   <- LLVM.xcframework
#
# Unlike the reference workflow, every artifact listed above is produced by
# the build itself (no `if: false` jobs, no mismatched paths) and is uploaded
# with `if-no-files-found: error`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/build-rust-ios.yml"
      - "Makefile"
      - "Scripts/**"
  workflow_dispatch:
    inputs:
      rust_version:
        description: "Rust release tag to build"
        required: true
        default: "1.99.1"
      ios_deployment_target:
        description: "iOS deployment target"
        required: true
        default: "16.0"
      stage:
        description: "Bootstrap stage (2 = optimised self-hosting compiler)"
        required: true
        default: "2"
      build_xcframework:
        description: "Also build Rust.xcframework (needs rustc_private)"
        type: boolean
        default: true

permissions:
  contents: write
  # The build reports its outcome (and the reason for a failure) as a PR
  # comment, because the job logs are not reachable from everywhere.
  pull-requests: write

concurrency:
  group: build-rust-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_VERSION: ${{ github.event.inputs.rust_version || '1.99.1' }}
  IOS_DEPLOYMENT_TARGET: ${{ github.event.inputs.ios_deployment_target || '16.0' }}
  STAGE: ${{ github.event.inputs.stage || '2' }}
  BUILD_XCFRAMEWORK: ${{ github.event.inputs.build_xcframework || 'true' }}
  # Bump these to invalidate the caches below (e.g. after changing configure).
  CACHE_VERSION: "1"
  # Bump when the LLVM/CMake configuration changes, so a stale LLVM tree is
  # never restored (bootstrap trusts the build stamps inside it).
  LLVM_CACHE_VERSION: "3"
  # Never export SDKROOT: the build host is macOS, only the iOS compilation
  # should see the iPhoneOS SDK (the script handles that itself).
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    # Everything this job produces is iOS/arm64 (see README: macOS is only the
    # build environment). Non-iOS binaries make `verify`/`package` fail.
    name: rustc for iOS (aarch64-apple-ios)
    # GitHub-hosted runners are limited to 6 hours per job.
    timeout-minutes: 360
    runs-on: macos-14
    outputs:
      rust_version: ${{ steps.version.outputs.rust_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail
          uname -a
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          python3 --version
          cmake --version | sed -n 1p
          ninja --version
          df -h /
          Scripts/build-rust-toolchain.sh info
          echo "rust_version=${RUST_VERSION}" >> "${GITHUB_OUTPUT}"
        id: version

      - name: Free disk space
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "disk before:"; df -h /
          # Keep the selected Xcode, drop the other copies.
          selected="$(xcode-select -p)"
          selected="${selected%/Contents/Developer}"
          for xcode in /Applications/Xcode*.app; do
            if [ "${xcode}" != "${selected}" ]; then
              echo "removing ${xcode}"
              sudo rm -rf "${xcode}"
            fi
          done
          # Simulators are useless for device builds.
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData" || true
          rm -rf "${HOME}/Library/Developer/CoreSimulator" || true
          echo "disk after:"; df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          fi
          ninja --version

      # Two caches, both keyed on inputs (never on a run id) so that a hit is a
      # genuine hit:
      #   rust-src-*  : the Rust checkout + the two submodules we need
      #   rust-llvm-* : the macOS and iOS LLVM build trees + the stage0 download
      # Everything else is cheap to rebuild.
      #
      # sccache is deliberately not used: its GitHub Actions backend talks to
      # Azure storage, and a single transient storage error there aborts the
      # compiler invocation (it killed a run at the first LLVM object file with
      # "cache storage failed to read").
      - name: Restore Rust sources
        id: cache-rust-src
        uses: actions/cache/restore@v4
        with:
          path: rust-source
          key: rust-src-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}

      # One LLVM cache, saved twice: once after stage 1 (the LLVM that stage 1
      # needs) and once at the end (both LLVM trees). The restore step uses a
      # prefix, so a run that only got as far as stage 1 still warms the next
      # run - which matters, because a cold stage-2 build does not fit in
      # GitHub's 6 h job limit and a timed-out job runs no steps at all.
      - name: Restore LLVM build trees
        id: cache-llvm
        uses: actions/cache/restore@v4
        with:
          path: |
            rust-source/build/cache
            rust-source/build/aarch64-apple-darwin/llvm
            rust-source/build/x86_64-apple-darwin/llvm
            rust-source/build/aarch64-apple-ios/llvm
          key: rust-llvm-${{ env.CACHE_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ env.IOS_DEPLOYMENT_TARGET }}-stage2
          restore-keys: |
            rust-llvm-${{ env.CACHE_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ env.IOS_DEPLOYMENT_TARGET }}-

      - name: Fetch Rust sources
        run: Scripts/build-rust-toolchain.sh fetch

      - name: Save Rust sources
        continue-on-error: true
        if: steps.cache-rust-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: rust-source
          key: rust-src-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}

      - name: Configure bootstrap
        run: |
          set -o pipefail
          echo "===== configure =====" | tee -a build.log
          Scripts/build-rust-toolchain.sh configure 2>&1 | tee -a build.log

      # Build in two stages and cache in between: whichever LLVM stage 1
      # needs is already expensive on a cold runner, and a stage-2 timeout
      # (the job is limited to 6 h) must not throw it away.
      # A cross-host build needs a compiler that runs on the build machine:
      # stage 1 produces that compiler (plus the build machine's LLVM and the
      # iOS std), stage 2 uses it to produce the compiler that runs on iOS.
      - name: Build stage 1 (build-machine compiler)
        run: |
          set -o pipefail
          echo "===== build stage 1 (host phase) =====" | tee -a build.log
          RUSTIOS_BUILD_PHASE=host Scripts/build-rust-toolchain.sh build 2>&1 | tee -a build.log

      - name: Save LLVM build trees (after stage 1)
        continue-on-error: true
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            rust-source/build/cache
            rust-source/build/aarch64-apple-darwin/llvm
            rust-source/build/x86_64-apple-darwin/llvm
            rust-source/build/aarch64-apple-ios/llvm
          key: rust-llvm-${{ env.CACHE_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ env.IOS_DEPLOYMENT_TARGET }}-stage1

      - name: Build stage 2 (rustc for iOS)
        run: |
          set -o pipefail
          echo "===== build stage 2 (target phase) =====" | tee -a build.log
          RUSTIOS_BUILD_PHASE=target Scripts/build-rust-toolchain.sh build 2>&1 | tee -a build.log

      # `set -e` deliberately not used: the exit code is reported explicitly,
      # and on failure the state that matters is dumped into build.log (the
      # only part of the run that is visible from the PR comment).
      - name: Verify artifacts
        run: |
          set -o pipefail
          echo "===== verify =====" | tee -a build.log
          rc=0
          Scripts/build-rust-toolchain.sh verify 2>&1 | tee -a build.log || rc=$?
          echo "verify exited with ${rc}" | tee -a build.log
          if [ "${rc}" -ne 0 ]; then
            for dir in rust-source/build/aarch64-apple-ios/stage2/bin \
                       rust-source/build/aarch64-apple-ios/stage2/lib \
                       rust-source/build/aarch64-apple-ios/stage2/lib/rustlib/aarch64-apple-ios/lib \
                       rust-source/build/aarch64-apple-darwin/stage1/lib/rustlib/aarch64-apple-ios/lib; do
              echo "--- ${dir} ---" | tee -a build.log
              ls -la "${dir}" 2>&1 | head -40 | tee -a build.log
            done
            echo "--- disk ---" | tee -a build.log
            df -h / | tee -a build.log
            du -sh rust-source/build 2>/dev/null | tee -a build.log
            exit 1
          fi

      - name: Package RustToolchain
        run: |
          set -o pipefail
          echo "===== package =====" | tee -a build.log
          Scripts/build-rust-toolchain.sh package 2>&1 | tee -a build.log

      - name: Package support libraries
        run: |
          set -o pipefail
          echo "===== support =====" | tee -a build.log
          Scripts/build-rust-toolchain.sh support 2>&1 | tee -a build.log

      - name: Build Rust.xcframework
        if: env.BUILD_XCFRAMEWORK == 'true'
        run: |
          set -o pipefail
          echo "===== xcframework =====" | tee -a build.log
          Scripts/build-rust-toolchain.sh xcframework 2>&1 | tee -a build.log

      - name: Upload RustToolchain + support libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustios-toolchain-${{ env.RUST_VERSION }}
          path: |
            artifacts/RustToolchain-*.tar.xz
            artifacts/RustSupportLibs-*.tar.xz
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload Rust.xcframework
        if: always() && env.BUILD_XCFRAMEWORK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustios-xcframework-${{ env.RUST_VERSION }}
          path: artifacts/Rust.xcframework-*.tar.xz
          if-no-files-found: error
          retention-days: 90

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustios-logs-${{ env.RUST_VERSION }}
          path: |
            build.log
            artifacts/REPORT.txt
            rust-source/build/*.log
            rust-source/build/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      # Saved even on failure: a half-built LLVM is still useful on the next
      # run (ninja/cmake pick up where they left off).
      - name: Save LLVM build trees (final)
        continue-on-error: true
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            rust-source/build/cache
            rust-source/build/aarch64-apple-darwin/llvm
            rust-source/build/x86_64-apple-darwin/llvm
            rust-source/build/aarch64-apple-ios/llvm
          key: rust-llvm-${{ env.CACHE_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ env.IOS_DEPLOYMENT_TARGET }}-stage2

      # Job logs are only downloadable from GitHub's blob storage, which is not
      # reachable from every environment; a PR comment with the tail of
      # build.log is. It is edited in place on every run, so the PR never fills
      # up with bot comments.
      - name: Report to pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "### rustios build: ${JOB_STATUS}"
            echo
            echo "Run: ${RUN_URL}"
            echo
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "| artifact | size |"
              echo "| --- | --- |"
              for f in artifacts/*.tar.xz; do
                if [ -e "$f" ]; then
                  echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
                fi
              done
              echo
              echo "SHA-256:"
              echo
              echo '```'
              cat artifacts/SHA256SUMS.txt 2>/dev/null || echo "(no checksums)"
              echo '```'
              if [ -s artifacts/REPORT.txt ]; then
                echo
                echo "<details><summary>artifact report</summary>"
                echo
                echo '```'
                cat artifacts/REPORT.txt
                echo '```'
                echo
                echo "</details>"
              fi
            else
              echo "Build failed. Tail of build.log:"
              echo
              echo '```'
              if [ -s build.log ]; then
                tail -c 50000 build.log | tail -n 300
              else
                echo "(build.log is empty - the failure happened before the first command)"
              fi
              echo '```'
              if [ -s artifacts/REPORT.txt ]; then
                echo
                echo "artifact report:"
                echo
                echo '```'
                cat artifacts/REPORT.txt
                echo '```'
              fi
            fi
          } > report.md
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body-file report.md --edit-last --create-if-none

      - name: Summary
        if: always()
        run: |
          {
            echo "## rustios ${RUST_VERSION}"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| host / target | \`${HOST_TRIPLE:-aarch64-apple-ios}\` |"
            echo "| iOS deployment target | \`${IOS_DEPLOYMENT_TARGET}\` |"
            echo "| cache hit (LLVM) | \`${{ steps.cache-llvm.outputs.cache-hit }}\` |"
            echo "| cache hit (sources) | \`${{ steps.cache-rust-src.outputs.cache-hit }}\` |"
            echo
            echo '```'
            ls -lh artifacts 2>/dev/null || true
            echo '```'
            cat artifacts/SHA256SUMS.txt 2>/dev/null || true
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "rustios ${GITHUB_REF_NAME}" \
              --notes "Rust ${RUST_VERSION} built for aarch64-apple-ios (iOS ${IOS_DEPLOYMENT_TARGET}).

          * \`RustToolchain-*.tar.xz\` - rustc/rustdoc/std that run on iOS
          * \`RustSupportLibs-*.tar.xz\` - LLVM + std for iOS
          * \`Rust.xcframework-*.tar.xz\` - the compiler as a static library with a C API"
          fi
