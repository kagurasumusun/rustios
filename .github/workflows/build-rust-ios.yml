name: build-rust-ios

# Builds a Rust toolchain whose *host* is aarch64-apple-ios, i.e. a rustc that
# runs on an iPhone (the same idea as emexlab/LLVM-On-iOS, which cross-builds
# clang/Swift for iOS), and packages it the way LLVM-On-iOS does:
#
#   RustToolchain-iphoneos-arm64-<ver>.tar.xz      <- SwiftToolchain.zip
#   RustSupportLibs-iphoneos-arm64-<ver>.tar.xz    <- CoreCompilerSupportLibs
#   Rust.xcframework-iphoneos-arm64-<ver>.tar.xz   <- LLVM.xcframework
#
# Unlike the reference workflow, every artifact listed above is produced by
# the build itself (no `if: false` jobs, no mismatched paths) and is uploaded
# with `if-no-files-found: error`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/build-rust-ios.yml"
      - "Makefile"
      - "Scripts/**"
  workflow_dispatch:
    inputs:
      rust_version:
        description: "Rust release tag to build"
        required: true
        default: "1.99.1"
      ios_deployment_target:
        description: "iOS deployment target"
        required: true
        default: "16.0"
      stage:
        description: "Bootstrap stage (2 = optimised self-hosting compiler)"
        required: true
        default: "2"
      build_xcframework:
        description: "Also build Rust.xcframework (needs rustc_private)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-rust-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_VERSION: ${{ github.event.inputs.rust_version || '1.99.1' }}
  IOS_DEPLOYMENT_TARGET: ${{ github.event.inputs.ios_deployment_target || '16.0' }}
  STAGE: ${{ github.event.inputs.stage || '2' }}
  BUILD_XCFRAMEWORK: ${{ github.event.inputs.build_xcframework || 'true' }}
  # Bump these to invalidate the caches below (e.g. after changing configure).
  CACHE_VERSION: "1"
  LLVM_CACHE_VERSION: "1"
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: "10G"
  # Never export SDKROOT: the build host is macOS, only the iOS compilation
  # should see the iPhoneOS SDK (the script handles that itself).
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: rustc for aarch64-apple-ios
    # GitHub-hosted runners are limited to 6 hours per job.
    timeout-minutes: 360
    runs-on: macos-14
    outputs:
      rust_version: ${{ steps.version.outputs.rust_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail
          uname -a
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          python3 --version
          cmake --version | sed -n 1p
          ninja --version
          df -h /
          Scripts/build-rust-toolchain.sh info
          echo "rust_version=${RUST_VERSION}" >> "${GITHUB_OUTPUT}"
        id: version

      - name: Free disk space
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "disk before:"; df -h /
          # Keep the selected Xcode, drop the other copies.
          selected="$(xcode-select -p)"
          selected="${selected%/Contents/Developer}"
          for xcode in /Applications/Xcode*.app; do
            if [ "${xcode}" != "${selected}" ]; then
              echo "removing ${xcode}"
              sudo rm -rf "${xcode}"
            fi
          done
          # Simulators are useless for device builds.
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf "${HOME}/Library/Developer/Xcode/DerivedData" || true
          rm -rf "${HOME}/Library/Developer/CoreSimulator" || true
          echo "disk after:"; df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja
          fi
          ninja --version

      # sccache caches individual rustc/clang invocations (stage 1/2 rustc and
      # the LLVM build). It is used as both RUSTC_WRAPPER and as the CMake
      # compiler launcher by bootstrap.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # Two caches, both keyed on inputs (never on a run id) so that a hit is a
      # genuine hit:
      #   rust-src-*  : the Rust checkout + the two submodules we need
      #   rust-llvm-* : the macOS and iOS LLVM build trees + the stage0 download
      # Everything else is cheap, or covered by sccache (which writes to the
      # GitHub Actions cache itself, so a killed job still leaves objects).
      - name: Restore Rust sources
        id: cache-rust-src
        uses: actions/cache/restore@v4
        with:
          path: rust-source
          key: rust-src-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}

      # One LLVM cache, saved twice: once after stage 1 (the LLVM that stage 1
      # needs) and once at the end (both LLVM trees). The restore step uses a
      # prefix, so a run that only got as far as stage 1 still warms the next
      # run - which matters, because a cold stage-2 build does not fit in
      # GitHub's 6 h job limit and a timed-out job runs no steps at all.
      - name: Restore LLVM build trees
        id: cache-llvm
        uses: actions/cache/restore@v4
        with:
          path: |
            rust-source/build/cache
            rust-source/build/aarch64-apple-darwin/llvm
            rust-source/build/x86_64-apple-darwin/llvm
            rust-source/build/aarch64-apple-ios/llvm
          key: rust-llvm-${{ env.CACHE_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ env.IOS_DEPLOYMENT_TARGET }}-stage2
          restore-keys: |
            rust-llvm-${{ env.CACHE_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ env.IOS_DEPLOYMENT_TARGET }}-

      - name: Fetch Rust sources
        run: Scripts/build-rust-toolchain.sh fetch

      - name: Save Rust sources
        if: steps.cache-rust-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: rust-source
          key: rust-src-${{ env.CACHE_VERSION }}-${{ env.RUST_VERSION }}

      - name: Configure bootstrap
        run: Scripts/build-rust-toolchain.sh configure

      # Build in two stages and cache in between: whichever LLVM stage 1
      # needs is already expensive on a cold runner, and a stage-2 timeout
      # (the job is limited to 6 h) must not throw it away.
      - name: Build stage 1
        run: STAGE=1 Scripts/build-rust-toolchain.sh build

      - name: Save LLVM build trees (after stage 1)
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            rust-source/build/cache
            rust-source/build/aarch64-apple-darwin/llvm
            rust-source/build/x86_64-apple-darwin/llvm
            rust-source/build/aarch64-apple-ios/llvm
          key: rust-llvm-${{ env.CACHE_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ env.IOS_DEPLOYMENT_TARGET }}-stage1

      - name: Build stage 2 (final rustc)
        run: Scripts/build-rust-toolchain.sh build

      - name: Verify artifacts
        run: Scripts/build-rust-toolchain.sh verify

      - name: Package RustToolchain
        run: Scripts/build-rust-toolchain.sh package

      - name: Package support libraries
        run: Scripts/build-rust-toolchain.sh support

      - name: Build Rust.xcframework
        if: env.BUILD_XCFRAMEWORK == 'true'
        run: Scripts/build-rust-toolchain.sh xcframework

      - name: Upload RustToolchain + support libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustios-toolchain-${{ env.RUST_VERSION }}
          path: |
            artifacts/RustToolchain-*.tar.xz
            artifacts/RustSupportLibs-*.tar.xz
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload Rust.xcframework
        if: always() && env.BUILD_XCFRAMEWORK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustios-xcframework-${{ env.RUST_VERSION }}
          path: artifacts/Rust.xcframework-*.tar.xz
          if-no-files-found: error
          retention-days: 90

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustios-logs-${{ env.RUST_VERSION }}
          path: |
            rust-source/build/*.log
            rust-source/build/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      # Saved even on failure: a half-built LLVM is still useful on the next
      # run (ninja/cmake pick up where they left off).
      - name: Save LLVM build trees (final)
        if: always() && steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            rust-source/build/cache
            rust-source/build/aarch64-apple-darwin/llvm
            rust-source/build/x86_64-apple-darwin/llvm
            rust-source/build/aarch64-apple-ios/llvm
          key: rust-llvm-${{ env.CACHE_VERSION }}-${{ env.LLVM_CACHE_VERSION }}-${{ env.RUST_VERSION }}-${{ env.IOS_DEPLOYMENT_TARGET }}-stage2

      - name: Summary
        if: always()
        run: |
          {
            echo "## rustios ${RUST_VERSION}"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| host / target | \`${HOST_TRIPLE:-aarch64-apple-ios}\` |"
            echo "| iOS deployment target | \`${IOS_DEPLOYMENT_TARGET}\` |"
            echo "| cache hit (LLVM) | \`${{ steps.cache-llvm.outputs.cache-hit }}\` |"
            echo "| cache hit (sources) | \`${{ steps.cache-rust-src.outputs.cache-hit }}\` |"
            echo
            echo '```'
            ls -lh artifacts 2>/dev/null || true
            echo '```'
            cat artifacts/SHA256SUMS.txt 2>/dev/null || true
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "rustios ${GITHUB_REF_NAME}" \
              --notes "Rust ${RUST_VERSION} built for aarch64-apple-ios (iOS ${IOS_DEPLOYMENT_TARGET}).

          * \`RustToolchain-*.tar.xz\` - rustc/rustdoc/std that run on iOS
          * \`RustSupportLibs-*.tar.xz\` - LLVM + std for iOS
          * \`Rust.xcframework-*.tar.xz\` - the compiler as a static library with a C API"
          fi
