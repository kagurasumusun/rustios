# Preset for Scripts/build-swift-toolchain.sh (Swift's utils/build-script).
#
# Derived from emexlab/LLVM-On-iOS' nyxian_iphoneos_arm64_crosscompiler preset,
# which is the known-good recipe for an LLVM + Swift that run on an arm64
# iPhone/iPad. Differences are marked "rustios:".
#
# The important properties:
#   * both compilers are built for the *cross* host iphoneos-arm64, so swiftc
#     and swift-frontend are iOS/arm64 binaries (macOS is only the build host);
#   * LLVM is built twice - once for macOS (the compiler that does the work
#     runs there) and once for iOS (the one that is shipped). Only the iOS one
#     is used by the Rust compiler;
#   * static libraries only, no Swift stdlib (it would be built for the host),
#     no testing/sourcekit/benchmarks: this is a compiler, not a distribution.

[preset: rustios_iphoneos_arm64]

build-subdir=LLVMClangSwift_iphoneos
release
reconfigure
no-assertions
no-llvm-assertions
no-swift-assertions
no-swift-stdlib-assertions

# rustios: AArch64 only - the one backend the shipped compiler emits for.
#
# Both compilers run on arm64 (macosx-arm64 on the build host,
# iphoneos-arm64 on the device) and rustc is built for the single target
# aarch64-apple-ios, so every other backend is only build time and artifact
# size. This is a deliberate scope decision (2026-10-27), not parity with
# rust-lang/rust's own `llvm.targets=all` default: a rustc for iOS built this
# way cannot cross-compile to another target. docs/llvm-parity.md sec. 4.5
# records what that costs and why it was accepted.
#
# Measured, so that this is not changed back by accident:
#   * `AArch64` alone failed while compiler-rt's builtins were built, with
#     -arm-add-build-attributes (an ARM-backend option). The builtins are the
#     only part of the recipe that compiles 32-bit ARM, and they are built for
#     the *host* only here (build-script passes COMPILER_RT_ENABLE_IOS=NO for
#     every Apple host), so switching them off loses nothing that ships to the
#     device;
#   * `AArch64;ARM;X86` builds in ~4 h;
#   * `all` builds both trees in ~5 h 30 min.
llvm-targets-to-build=AArch64

cross-compile-hosts=iphoneos-arm64
compiler-vendor=apple
swift-primary-variant-sdk=IOS
swift-primary-variant-arch=arm64
extra-cmake-options=
    -DLLVM_ENABLE_BACKTRACES:BOOL=ON
    -DLLVM_ENABLE_ZSTD:STRING=OFF
    -DCOMPILER_RT_BUILD_BUILTINS:BOOL=OFF
    -DBUILD_TESTING:BOOL=OFF
    -DCLANG_ENABLE_CLANGD:BOOL=OFF
    -DSWIFT_BUILD_SOURCEKIT:BOOL=FALSE
    -DSWIFT_ENABLE_SOURCEKIT_TESTS:BOOL=FALSE
    -DLLVM_ENABLE_THREADS:BOOL=ON
    -DLLVM_ENABLE_ASSERTIONS=OFF
    -DLLVM_ENABLE_RTTI:BOOL=ON
    -DLLVM_ENABLE_EH:BOOL=OFF
    -DLLVM_ENABLE_TERMINFO=BOOL=ON
    -DLLVM_UNREACHABLE_OPTIMIZE=OFF
    -DCMAKE_C_COMPILER_TARGET=arm64-apple-darwin
    -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-darwin

# rustios: nothing is switched off here that either compiler would have had.
# LLVM_ENABLE_BACKTRACES and LLVM_ENABLE_TERMINFO are LLVM's own defaults (ON);
# rust-lang/rust does not override them either, so the previous explicit OFF
# was a capability loss for crash reporting
# (llvm::sys::PrintStackTraceOnErrorSignal) and for terminal-width-aware
# diagnostics in the tools. Both degrade gracefully if the SDK has no
# terminfo, so there is nothing to lose by asking.
#
# zlib is *not* in this list any more. rust-lang/rust turns zlib OFF for
# *-apple-{ios,tvos,watchos,visionos} ("Zlib fails to link properly") but ON for
# the host, and these options reach both trees, so one value cannot serve both.
# build-swift-toolchain.sh therefore seeds each build tree's CMake cache before
# build-script runs: the iOS tree gets LLVM_ENABLE_ZLIB=OFF (as rust does for
# apple-mobile) and the macOS tree keeps LLVM's default, ON (as rust's host
# LLVM has). See docs/llvm-parity.md §2.
#
# COMPILER_RT_BUILD_BUILTINS=OFF: the builtins are compiled for the host only
# here (build-script passes COMPILER_RT_ENABLE_IOS=NO for every Apple host), so
# nothing that ships to the device is dropped; and they are the only part of the
# recipe that compiles 32-bit ARM, which a compiler built for AArch64 alone
# cannot do. Everything else compiler-rt builds (sanitizer runtimes) stays.
#
# Deliberately left alone, because these match what the other side gets:
#   * LLVM_ENABLE_ZSTD=OFF - rust passes OFF too (`llvm.libzstd` defaults to
#     false, llvm.rs turns that into -DLLVM_ENABLE_ZSTD=OFF);
#   * LLVM_ENABLE_RTTI=ON / LLVM_ENABLE_EH=OFF / assertions OFF - identical to
#     the release configuration rust ships;
#   * LLVM_ENABLE_PLUGINS - left at the CMake default (ON on Darwin via
#     LLVM_ENABLE_PIC) where rust's apple-mobile build turns it OFF. A superset:
#     rustc never loads LLVM plugins, so nothing is lost by having it.
#
# LLVM_UNREACHABLE_OPTIMIZE=OFF is what rust-lang/rust always passes: without
# it, `llvm_unreachable` in a release LLVM is undefined behaviour instead of an
# abort with a message. It costs Swift nothing measurable (the branch is
# noreturn either way) and makes a crash in either compiler diagnosable.

build-toolchain-only=1
build-stdlib-deployment-targets=
skip-build-clang-tools-extra
build-swift-static-stdlib=0
build-swift-dynamic-stdlib=0
build-swift-static-sdk-overlay=0
build-swift-dynamic-sdk-overlay=0
build-swift-libexec=0
build-runtime-with-host-compiler=0
skip-build-benchmarks
llvm-include-tests=0
llvm-enable-modules=0
build-swift-examples=0
swift-include-tests=0
darwin-deployment-version-ios=16.0
darwin-crash-reporter-client=1
llvm-install-components=llvm-ar;llvm-nm;llvm-ranlib;llvm-cov;llvm-profdata;llvm-objdump;llvm-objcopy;llvm-symbolizer;IndexStore;clang;clang-resource-headers;builtins;runtimes;libclang;LTO;clang-features-file;lld
host-target=macosx-arm64
